name: Build Hossam State ME iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Show project
        run: |
          echo "Project files:"
          find . -maxdepth 4 -type f | sort

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project HossamStateME/HossamStateME.xcodeproj \
            -scheme HossamStateME \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package App
        run: |
          mkdir -p artifacts
          cp -R ~/Library/Developer/Xcode/DerivedData/HossamStateME-*/Build/Products/Release-iphonesimulator/HossamStateME.app artifacts/

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: Hossam-State-ME-iOS-Simulator
          path: artifacts/HossamStateME.app              "platforms;android-35" \
              "build-tools;35.0.0" \
              "ndk;27.3.13750724" || true
          fi

      - name: Find or extract Android project
        run: |
          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          SETTINGS_FILE=$(find . \
            -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Gradle project found: $PROJECT_DIR"
          else
            echo "No Gradle project found."
            echo "Searching for ZIP files..."

            ZIP_FILE=$(find . -type f -name "*.zip" -print -quit)

            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP: $ZIP_FILE"

              mkdir -p extracted
              unzip -q "$ZIP_FILE" -d extracted

              SETTINGS_FILE=$(find extracted \
                -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
                -print -quit)

              if [ -n "$SETTINGS_FILE" ]; then
                PROJECT_DIR=$(dirname "$SETTINGS_FILE")
                echo "Extracted project: $PROJECT_DIR"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project
        run: |
          echo "Building from:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hossam-playing-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
