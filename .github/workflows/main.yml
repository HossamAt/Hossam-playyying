name: Build Hossam playing

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true

            "$SDKMANAGER" --install \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "ndk;27.3.13750724" || true
          fi

      - name: Find or extract Android project
        run: |
          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          SETTINGS_FILE=$(find . \
            -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Gradle project found: $PROJECT_DIR"
          else
            echo "No Gradle project found."
            echo "Searching for ZIP files..."

            ZIP_FILE=$(find . -type f -name "*.zip" -print -quit)

            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP: $ZIP_FILE"

              mkdir -p extracted
              unzip -q "$ZIP_FILE" -d extracted

              SETTINGS_FILE=$(find extracted \
                -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
                -print -quit)

              if [ -n "$SETTINGS_FILE" ]; then
                PROJECT_DIR=$(dirname "$SETTINGS_FILE")
                echo "Extracted project: $PROJECT_DIR"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project
        run: |
          echo "Building from:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hossam-playing-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
